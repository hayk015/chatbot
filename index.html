<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --user-bubble: #3b82f6;
      --user-text: #ffffff;
      --bot-bubble: #1e293b;
      --bot-border: #334155;
      --bot-text: #e2e8f0;
      --error-bg: #451a1a;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: white;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .model-tag {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      background: var(--card-bg);
      color: var(--text);
    }

    /* Chat Messages Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
    }

    .welcome-card {
      text-align: center;
      margin: auto;
      padding: 32px 20px;
      color: var(--text-muted);
    }

    .welcome-card h2 {
      color: var(--text);
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 0.95rem;
      max-width: 440px;
      line-height: 1.5;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot {
      align-self: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      font-weight: 600;
    }

    .user .avatar {
      background: var(--user-bubble);
      color: white;
    }

    .bot .avatar {
      background: var(--border);
      color: var(--accent);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background-color: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      color: var(--bot-text);
      border-bottom-left-radius: 4px;
    }

    .error-bubble {
      background-color: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    /* Typing Dots */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      border-radius: 12px;
      width: fit-content;
    }

    .dot {
      width: 7px;
      height: 7px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
    }

    form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      position: relative;
    }

    textarea {
      flex: 1;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 140px;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      background: var(--user-bubble);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button[type="submit"]:hover:not(:disabled) {
      opacity: 0.9;
    }

    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-badge">⚡</div>
      <div>
        <h1>AI Chatbot</h1>
      </div>
      <span class="model-tag" id="model-tag">llama-3.1-8b-instant</span>
    </div>
    <button class="btn-clear" id="btn-clear" title="Clear conversation">Clear</button>
  </header>

  <main id="chat-container">
    <div class="welcome-card" id="welcome-card">
      <h2>How can I help you today?</h2>
      <p>Send a message below to start chatting with your AI assistant.</p>
    </div>
  </main>

  <footer>
    <form id="chat-form">
      <textarea
        id="user-input"
        placeholder="Type a message... (Press Enter to send, Shift+Enter for new line)"
        rows="1"
        required
      ></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const welcomeCard = document.getElementById("welcome-card");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const modelTag = document.getElementById("model-tag");
    const btnClear = document.getElementById("btn-clear");

    // Conversation history to maintain context
    let history = [];

    // Auto-expand textarea
    userInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 140) + "px";
    });

    // Enter to submit, Shift+Enter for newline
    userInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event("submit"));
      }
    });

    // Clear chat
    btnClear.addEventListener("click", () => {
      history = [];
      chatContainer.innerHTML = "";
      if (welcomeCard) chatContainer.appendChild(welcomeCard);
      userInput.focus();
    });

    function appendMessage(role, content, isError = false) {
      if (welcomeCard && welcomeCard.parentNode) {
        welcomeCard.remove();
      }

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "AI";

      const bubble = document.createElement("div");
      bubble.className = `bubble ${isError ? "error-bubble" : ""}`;
      bubble.textContent = content;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement("div");
      typingDiv.className = "message bot";
      typingDiv.id = "typing-indicator";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";

      const dots = document.createElement("div");
      dots.className = "typing-indicator";
      dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

      typingDiv.appendChild(avatar);
      typingDiv.appendChild(dots);

      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // Add user message
      appendMessage("user", text);
      history.push({ role: "user", content: text });

      userInput.value = "";
      userInput.style.height = "auto";
      sendBtn.disabled = true;
      userInput.disabled = true;

      showTypingIndicator();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });

        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          appendMessage("bot", `Error: ${data.error || "Failed to get reply."}`, true);
        } else {
          appendMessage("bot", data.reply);
          history.push({ role: "assistant", content: data.reply });
          if (data.model) {
            modelTag.textContent = data.model;
          }
        }
      } catch (err) {
        removeTypingIndicator();
        appendMessage("bot", "Error: Failed to connect to server.", true);
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
